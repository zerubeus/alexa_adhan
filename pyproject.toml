[project]
name = "alexa-adhan"
version = "0.1.0"
description = "Alexa skill to get the prayer times"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "zerubeus", email = "zerubeus@gmail.com" }
]
dependencies = [
    "aws-lambda-powertools>=3.4.1",
    "ask-sdk>=1.19.0",
    "boto3>=1.36.7",
    "requests>=2.32.3",
    "pytz>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lambda"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
